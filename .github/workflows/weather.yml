name: Daily Weather Update

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install requests pandas

    - name: Run script
      run: python scripts/generate_weather.py

    - name: Commit CSV
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add data/daily_weather_report.csv
        git commit -m "Daily weather update" || echo "No changes"
        git push