# keep-alive
name: Daily Weather Update

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install requests pandas

    - name: Run script
      run: |
        python scripts/generate_weather.py
        echo "Script completed"
        ls -la data/
        cat data/daily_weather_report.csv

    - name: Check for changes
      run: |
        git status
        git diff data/daily_weather_report.csv

    - name: Commit CSV
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add data/daily_weather_report.csv
        git diff --staged --quiet || git commit -m "Daily weather update [$(date +'%Y-%m-%d')]"
        git push